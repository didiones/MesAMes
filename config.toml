# Tema do app. Todos os componentes nativos (cards, tabelas, gráficos) seguem estas cores.
[theme]
base = "dark"
primaryColor = "#3FA37E"
backgroundColor = "#10181A"
secondaryBackgroundColor = "#182427"
textColor = "#E7ECEA"
borderColor = "#2A3A3E"
redColor = "#D9534F"
greenColor = "#3FA37E"
orangeColor = "#E0A458"
blueColor = "#4A8FD4"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "0.6rem"
metricValueFontSize = "1.7rem"
metricValueFontWeight = 600
showSidebarBorder = true
chartCategoricalColors = ["#3FA37E", "#D9534F", "#4A8FD4", "#E0A458", "#9B7FD1", "#5BB5C8", "#C9789A", "#8FA35A"]

[server]
maxUploadSize = 20

[client]
toolbarMode = "minimal"
